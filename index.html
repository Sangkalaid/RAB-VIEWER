    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        try {
          if (window.Window && window.Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
            if (protoDesc && protoDesc.configurable) {
              var _protoFetch = window.Window.prototype.fetch;
              Object.defineProperty(window.Window.prototype, 'fetch', {
                get: function() {
                  return _protoFetch;
                },
                set: function(val) {
                  _protoFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('chrome-extension://') !== -1 ||
              event.message.indexOf('Cannot set property fetch') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
