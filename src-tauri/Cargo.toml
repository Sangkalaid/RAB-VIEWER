[package]
name = "rab_viewer"
version = "0.1.3"
description = "RAB VIEWER"
authors = ["RAB VIEWER"]
edition = "2021"

[lib]
name = "rab_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
